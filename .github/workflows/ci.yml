name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      load_messages:
        description: "Campaign size for the load test"
        default: "10000"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (lint, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smsgw
          POSTGRES_PASSWORD: smsgw
          POSTGRES_DB: smsgw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smsgw" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: gateway
    env:
      TEST_DATABASE_URL: postgresql://smsgw:smsgw@localhost:5432/smsgw_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: gateway/uv.lock
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  mock-carrier:
    name: Mock carrier (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-carrier
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: mock-carrier/uv.lock
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run pytest -q

  dashboard:
    name: Dashboard (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The real thing: `docker compose up` from a clean checkout, the test suite
  # inside the stack, then the full load script against two dispatchers.
  e2e:
    name: docker compose up + load test
    runs-on: ubuntu-latest
    needs: [gateway, mock-carrier, dashboard]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:8000/readyz
          curl --fail --silent http://localhost:9000/healthz
          curl --fail --silent --output /dev/null http://localhost:3000/
          curl --fail --silent http://localhost:3000/api/gateway/tenants | head -c 400

      - name: Test suite inside the stack
        run: docker compose run --rm -T tests

      - name: Load test
        shell: bash  # pipefail, so a failed load test fails the step despite the tee
        run: |
          docker compose run --rm -T loadtest \
            python /loadtest/load_test.py --messages "${{ inputs.load_messages || '10000' }}" \
            | tee load-test-output.txt

      - name: Carrier and webhook statistics
        if: always()
        run: |
          curl --silent http://localhost:9000/stats | python3 -m json.tool | tee carrier-stats.json
          curl --silent http://localhost:9100/stats | python3 -m json.tool | tee sink-stats.json

      - name: Upload the load test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-output
          path: |
            load-test-output.txt
            carrier-stats.json
            sink-stats.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
